<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Long Scroll</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Long Scroll</h1>
      <p class="tagline">
        A shared scroll. Everyone who visits can add one stroke to it; nothing on it is ever
        removed.
      </p>
      <p><a href="/readme/">what &ldquo;good&rdquo; means for this</a></p>
      <p id="live-status" class="live-status" role="status">connecting…</p>
    </header>

    <main>
      <p id="welcome-back" class="welcome-back" hidden></p>

      <section aria-label="the scroll">
        <ol id="scroll" class="scroll">
          <li class="scroll__empty" id="scroll-empty">the scroll is empty &mdash; be the first hand</li>
        </ol>
      </section>

      <form id="add-mark-form" aria-label="add your stroke">
        <fieldset>
          <legend>Add your stroke</legend>

          <div class="compose">
            <div class="pad-wrap">
              <canvas
                id="pad"
                class="pad"
                role="img"
                aria-label="drawing pad: draw one stroke with a mouse, finger or pen; with a keyboard, choose a shape instead"
              ></canvas>
              <button type="button" id="pad-clear">Clear the pad</button>
            </div>

            <fieldset class="shapes">
              <legend>Stroke</legend>
              <label id="shape-drawn-label" hidden
                ><input type="radio" name="shape" value="drawn" /> my drawing</label
              >
              <label><input type="radio" name="shape" value="wave" checked /> wave</label>
              <label><input type="radio" name="shape" value="peak" /> peak</label>
              <label><input type="radio" name="shape" value="hook" /> hook</label>
              <label><input type="radio" name="shape" value="loop" /> loop</label>
              <label><input type="radio" name="shape" value="dot" /> dot</label>
              <label><input type="radio" name="shape" value="line" /> line</label>
            </fieldset>
          </div>

          <div class="palette" role="radiogroup" aria-label="ink colour">
            <!-- populated by app.js from the same palette the server validates against -->
          </div>

          <p>
            <label for="note">a short note (optional)</label>
            <input id="note" name="note" type="text" maxlength="140" autocomplete="off" />
          </p>

          <button type="submit">Add to the scroll</button>
        </fieldset>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="site-footer">
      <p>
        <a href="https://github.com/comp4020-agentic-coding-studio/comp4020-final-dachi"
          >source</a
        >
      </p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
